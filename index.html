<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TLQ Workflows</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2e3a;
    --text: #e8eaed;
    --muted: #8b8f9a;
    --accent: #6d9eeb;
    --code-bg: #12141c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 2rem 1rem;
  }
  .container { max-width: 820px; margin: 0 auto; }
  header { margin-bottom: 1.5rem; }
  h1 { font-size: 1.6rem; font-weight: 600; margin-bottom: 0.25rem; }
  .subtitle { color: var(--muted); font-size: 0.9rem; }
  .search-box {
    width: 100%;
    padding: 0.75rem 1rem;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    margin-bottom: 1.25rem;
    outline: none;
  }
  .search-box:focus { border-color: var(--accent); }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.15rem 1.3rem;
    margin-bottom: 0.9rem;
  }
  .card h2 { font-size: 1.1rem; margin-bottom: 0.7rem; }
  .label { font-size: 0.8rem; color: var(--muted); margin: 0.7rem 0 0.2rem; }
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.85rem 1rem;
    overflow-x: auto;
    font-family: "SF Mono", Monaco, Consolas, monospace;
    font-size: 0.86rem;
    line-height: 1.5;
    position: relative;
  }
  .copy-btn {
    position: absolute;
    top: 0.45rem;
    right: 0.45rem;
    background: #252830;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.2rem 0.45rem;
    font-size: 0.72rem;
    cursor: pointer;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--accent); }
  .notes { margin-top: 0.7rem; font-size: 0.85rem; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 2rem; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>TLQ</h1>
    <p class="subtitle">Publish an episode</p>
  </header>
  <input type="text" class="search-box" id="search" placeholder="Search…" autofocus>
  <div id="results"></div>
</div>
<script>
const commands = [
  {
    id: "publish-episode",
    title: "Publish an episode",
    words: "publish episode audio mp3 cover metadata post ffmpeg topics",
    blocks: [
      {
        label: "",
        code: './publish-episode.sh "/path/to/TLQ-EP02.mp4" topics.txt'
      },
      {
        label: "topics.txt",
        code: "04:02.000–04:10.970 · You Can See Everything\nPHP2Shell"
      }
    ],
    notes: "Writes TLQ-EP02.mp3, the cover, and commits the episode page. Upload that mp3 to audio.tlq.dev before you push."
  }
];

const resultsEl = document.getElementById("results");
const searchEl = document.getElementById("search");

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function render(list) {
  if (list.length === 0) {
    resultsEl.innerHTML = '<div class="empty">No matches.</div>';
    return;
  }
  resultsEl.innerHTML = list.map(cmd => `
    <article class="card" id="${cmd.id}">
      <h2>${escapeHtml(cmd.title)}</h2>
      ${cmd.blocks.map(block => `
        ${block.label ? `<div class="label">${escapeHtml(block.label)}</div>` : ""}
        <pre><button class="copy-btn" type="button">Copy</button><code>${escapeHtml(block.code)}</code></pre>
      `).join("")}
      ${cmd.notes ? `<p class="notes">${escapeHtml(cmd.notes)}</p>` : ""}
    </article>
  `).join("");
}

function markCopied(btn) {
  const orig = btn.textContent;
  btn.textContent = "Copied";
  setTimeout(() => { btn.textContent = orig; }, 1400);
}

function copyCode(btn) {
  const code = btn.nextElementSibling.textContent;
  const fallback = () => {
    const area = document.createElement("textarea");
    area.value = code;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
    markCopied(btn);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(code).then(() => markCopied(btn)).catch(fallback);
  } else {
    fallback();
  }
}

resultsEl.addEventListener("click", (event) => {
  const btn = event.target.closest(".copy-btn");
  if (btn) copyCode(btn);
});

function filter() {
  const q = searchEl.value.toLowerCase().trim();
  if (!q) return render(commands);
  render(commands.filter(cmd => {
    const hay = [cmd.title, cmd.words, cmd.notes, cmd.blocks.map(block => block.label + " " + block.code).join(" ")].join(" ").toLowerCase();
    return hay.includes(q);
  }));
}

searchEl.addEventListener("input", filter);
render(commands);
</script>
</body>
</html>
