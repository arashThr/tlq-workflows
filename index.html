<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TLQ Workflows — Private Commands</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2e3a;
    --text: #e8eaed;
    --muted: #8b8f9a;
    --accent: #6d9eeb;
    --code-bg: #12141c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 2rem 1rem;
  }
  .container { max-width: 820px; margin: 0 auto; }
  header { margin-bottom: 1.5rem; }
  h1 { font-size: 1.6rem; font-weight: 600; margin-bottom: 0.25rem; }
  .subtitle { color: var(--muted); font-size: 0.9rem; }
  .search-box {
    width: 100%;
    padding: 0.75rem 1rem;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    margin-bottom: 1.25rem;
    outline: none;
  }
  .search-box:focus { border-color: var(--accent); }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.15rem 1.3rem;
    margin-bottom: 0.9rem;
  }
  .category {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent);
    margin-bottom: 0.3rem;
  }
  .card h2 { font-size: 1.1rem; margin-bottom: 0.35rem; }
  .tags { margin-bottom: 0.5rem; }
  .tag {
    display: inline-block;
    background: #252830;
    color: var(--muted);
    font-size: 0.72rem;
    padding: 0.12rem 0.45rem;
    border-radius: 4px;
    margin-right: 0.35rem;
  }
  .desc { color: var(--muted); font-size: 0.9rem; margin-bottom: 0.7rem; }
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.85rem 1rem;
    overflow-x: auto;
    font-family: "SF Mono", Monaco, Consolas, monospace;
    font-size: 0.86rem;
    line-height: 1.5;
    position: relative;
  }
  .copy-btn {
    position: absolute;
    top: 0.45rem;
    right: 0.45rem;
    background: #252830;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.2rem 0.45rem;
    font-size: 0.72rem;
    cursor: pointer;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--accent); }
  .notes { margin-top: 0.7rem; font-size: 0.85rem; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 2rem; }
  footer { margin-top: 2.5rem; text-align: center; color: var(--muted); font-size: 0.78rem; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>TLQ Workflows</h1>
    <p class="subtitle">Private commands & flows for The Last Question</p>
  </header>

  <input type="text" class="search-box" id="search" placeholder="Search…" autofocus>

  <div id="results"></div>

  <footer>Last updated: 2026-10-28 · Personal use only</footer>
</div>

<script>
const commands = [
  {
    id: "design-system",
    category: "Design",
    title: "Poster & Brand Design System",
    tags: ["design", "poster", "brand", "entropy", "asimov", "black-and-white"],
    description: "Single source of truth for visual direction, Entropy Field poster style, prompts, and update process.",
    commands: [],
    notes: "Full documentation lives in <code>design/README.md</code>. Chosen direction: Entropy Field (dissolving geometric grid + tiny question mark). Easy episode number/title swap in Mac Preview. Reference image can be added alongside the docs."
  },
  {
    id: "extract-audio",
    category: "Audio",
    title: "Extract audio from video",
    tags: ["ffmpeg", "audio", "extract"],
    description: "Default for conversation / interview videos.",
    commands: [
      {
        label: "Recommended",
        code: "ffmpeg -i input.mp4 -vn -c:a libmp3lame -q:a 2 output.mp3"
      }
    ],
    notes: "MP3 with high-quality VBR (~190 kbps). Transparent for speech, widely compatible for podcasts. Use <code>-n</code> to avoid overwriting."
  },
  {
    id: "oneshot-normalize",
    category: "Editing — OneShot",
    title: "Normalize audio in OneShot",
    tags: ["oneshot", "audio", "normalize", "lufs"],
    description: "After creating the project, normalize the sound.",
    commands: [],
    notes: "Set the <strong>Target</strong> to the same value on both tracks.<br><br><strong>Recommended for YouTube conversational dialogue: -14 LUFS</strong><br>This matches YouTube’s loudness target for online video and keeps speech clear and present without being overly loud or crushed."
  },
  {
    id: "add-cover-metadata",
    category: "Audio",
    title: "Add cover art & metadata to MP3",
    tags: ["ffmpeg", "metadata", "cover", "id3", "mp3"],
    description: "Attach cover image and basic metadata to the extracted audio.",
    commands: [
      {
        label: "FFmpeg command",
        code: `ffmpeg -i input.mp3 -i cover.jpg -map 0 -map 1 -c copy -id3v2_version 3 \\
  -metadata title="TLQ 01 — Episode Title" \\
  -metadata artist="TLQ / Arash & Amin" \\
  -metadata album="The Last Question" \\
  -metadata date="2026" \\
  -metadata:s:v title="Cover" \\
  -metadata:s:v comment="Cover (front)" \\
  output.mp3`
      }
    ],
    notes: "Replace the metadata values and filenames. Cover should be a square JPEG (ideally 1400×1400 or larger).<br><br>A simple local script is also available in the repo (<code>add-metadata.sh</code>) that prompts for the values."
  }
];

const resultsEl = document.getElementById("results");
const searchEl = document.getElementById("search");

function render(list) {
  if (list.length === 0) {
    resultsEl.innerHTML = `<div class="empty">No matches.</div>`;
    return;
  }
  resultsEl.innerHTML = list.map(cmd => `
    <article class="card" data-id="${cmd.id}">
      <div class="category">${cmd.category || ""}</div>
      <h2>${cmd.title}</h2>
      <div class="tags">${cmd.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
      <p class="desc">${cmd.description}</p>
      ${cmd.commands.map(c => `
        <div style="margin-bottom:0.5rem;">
          ${c.label ? `<div style="font-size:0.8rem;color:var(--muted);margin-bottom:0.2rem;">${c.label}</div>` : ""}
          <pre><button class="copy-btn" onclick="copyCode(this)">Copy</button><code>${escapeHtml(c.code)}</code></pre>
        </div>
      `).join("")}
      ${cmd.notes ? `<div class="notes">${cmd.notes}</div>` : ""}
    </article>
  `).join("");
}

function escapeHtml(str) {
  return str.replace(/&/g, "&").replace(/</g, "<").replace(/>/g, ">");
}

function copyCode(btn) {
  const code = btn.nextElementSibling.textContent;
  navigator.clipboard.writeText(code).then(() => {
    const orig = btn.textContent;
    btn.textContent = "Copied!";
    setTimeout(() => btn.textContent = orig, 1400);
  });
}

function filter() {
  const q = searchEl.value.toLowerCase().trim();
  if (!q) return render(commands);
  const filtered = commands.filter(cmd => {
    const hay = [
      cmd.category || "",
      cmd.title,
      cmd.description,
      cmd.tags.join(" "),
      cmd.commands.map(c => (c.label || "") + " " + c.code).join(" "),
      cmd.notes || ""
    ].join(" ").toLowerCase();
    return hay.includes(q);
  });
  render(filtered);
}

searchEl.addEventListener("input", filter);
render(commands);
</script>
</body>
</html>
